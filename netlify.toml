# netlify.toml - one site, short name sends to official name

[[redirects]]
  from = "https://afcnus.org/*"
  to = "https://americafirstcitizensnetwork.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.afcnus.org/*"
  to = "https://americafirstcitizensnetwork.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://afcnus.org/*"
  to = "https://americafirstcitizensnetwork.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.afcnus.org/*"
  to = "https://americafirstcitizensnetwork.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
